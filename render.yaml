services:
  - type: web
    name: chasr
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/index.cjs
    healthCheckPath: /api/health
    disk:
      name: chasr-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
